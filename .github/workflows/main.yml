name: CI-CD - Monteiro
on: 
  push:
  workflow_dispatch:
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
    - name: Obtendo o código
      uses: actions/checkout@v4.1.5
    - name: Autenticação no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build da Imagem Docker
      uses: docker/build-push-action@v5.3.0
      with:
        context: ./src
        file: ./src/Dockerfile
        push: true
        tags: | 
          edymonte/aula-primeira-pipeline:v${{ github.run_number }} 
          edymonte/aula-primeira-pipeline:latest 
  CD-homolog:
    #needs: [CI]
    uses: edymonte/primeira-pipeline-cicd/.github/workflows/deploy.yml@main
    with:
      manifests: k8s/deployment.yaml
      images: edymonte/aula-primeira-pipeline:v${{ github.run_number }}
      environment: homologacao
    secrets: inherit
    
  test-Ambiente:
    needs: [CD-homolog]
    runs-on: ubuntu-latest
    environment: homologacao
    steps:
      - name: Fake Teste
        run: echo "Fake teste de ambiente ${{vars.APP_NAMESPACE}}"

  CD-producao:
    needs: [test-Ambiente]
    uses: edymonte/primeira-pipeline-cicd/.github/workflows/deploy.yml@main
    with:
      manifests: k8s/deployment.yaml
      images: edymonte/aula-primeira-pipeline:v${{ github.run_number }}
      environment: homologacao
    secrets: inherit 
